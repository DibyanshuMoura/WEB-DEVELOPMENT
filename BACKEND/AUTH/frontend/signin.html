<head>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
  async function signIn() {
      const username = document.querySelector(".userText").value;
      const password = document.querySelector(".userPassword").value;
      const res = await axios.post("http://localhost:3000/signin",
        { username, password }
      );
      const token = res.data.token;
      localStorage.setItem("token", token);
      window.location = "/"
    }
  </script>
</head>
<body>
  <input type="text" placeholder="username" class="userText">
  <input type="password" placeholder="password" class="userPassword">
  <button onclick="signIn()">Click to submit</button>
</body>
